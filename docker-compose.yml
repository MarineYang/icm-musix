version: '3.8'

services:
  # ICM Musix 프론트엔드
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://welcome2icm.com/supabase}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
    container_name: icm-musix-frontend
    ports:
      - "127.0.0.1:33000:80"
    networks:
      - icm-network
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-kong:
        condition: service_started
    environment:
      - NODE_ENV=production

  # PostgreSQL 데이터베이스
  supabase-db:
    image: supabase/postgres:15.1.0.117
    container_name: icm-supabase-db
    ports:
      - "127.0.0.1:54322:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icm1234!!}
      POSTGRES_DB: icm_db
      POSTGRES_USER: postgres
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    networks:
      - icm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (Kong)
  supabase-kong:
    image: kong:2.8.1
    container_name: icm-supabase-kong
    ports:
      - "127.0.0.1:54321:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      - icm-network
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy

  # REST API (PostgREST)
  supabase-rest:
    image: postgrest/postgrest:v11.2.2
    container_name: icm-supabase-rest
    environment:
      PGRST_DB_URI: "postgres://authenticator:${POSTGRES_PASSWORD:-icm1234!!}@supabase-db:5432/icm_db"
      PGRST_DB_SCHEMAS: "public,storage"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}"
      PGRST_DB_USE_LEGACY_GUCS: "false"
    networks:
      - icm-network
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy

  # Storage API (파일 업로드)
  supabase-storage:
    image: supabase/storage-api:v1.28.1
    container_name: icm-supabase-storage
    command: node dist/start/server.js
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-icm1234!!}@supabase-db:5432/icm_db
      DB_INSTALL_ROLES: "false"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      IS_MULTITENANT: "false"
      ENABLE_IMAGE_TRANSFORMATION: "false"
      ENABLE_QUEUE_EVENTS: "false"
      LOG_LEVEL: debug
    volumes:
      - supabase-storage-data:/var/lib/storage
    networks:
      - icm-network
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started

networks:
  icm-network:
    driver: bridge

volumes:
  supabase-db-data:
    driver: local
  supabase-storage-data:
    driver: local

