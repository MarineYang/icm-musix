version: '3.8'

# 프로덕션 환경용 Docker Compose 설정

services:
  # ICM Musix 프론트엔드 (SSL 포함)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: icm-musix-frontend-prod
    networks:
      - icm-network
    restart: always
    depends_on:
      - supabase-db
      - supabase-kong

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: icm-musix-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - icm-network
    restart: always
    depends_on:
      - frontend

  # Certbot for SSL renewal
  certbot:
    image: certbot/certbot
    container_name: icm-musix-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - icm-network

  # Supabase Services (같은 설정)
  supabase-db:
    image: supabase/postgres:15.1.0.117
    container_name: icm-supabase-db-prod
    ports:
      - "127.0.0.1:54322:5432"  # 외부 노출 방지
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    networks:
      - icm-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-kong:
    image: kong:2.8.1
    container_name: icm-supabase-kong-prod
    ports:
      - "127.0.0.1:54321:8000"  # 외부 노출 방지
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      - icm-network
    restart: always

  supabase-studio:
    image: supabase/studio:20231123-64a766a
    container_name: icm-supabase-studio-prod
    ports:
      - "127.0.0.1:54323:3000"  # 외부 노출 방지
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
    networks:
      - icm-network
    restart: always

  supabase-auth:
    image: supabase/gotrue:v2.99.0
    container_name: icm-supabase-auth-prod
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${URI_ALLOW_LIST}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: true
      GOTRUE_MAILER_AUTOCONFIRM: false
    networks:
      - icm-network
    restart: always

  supabase-rest:
    image: postgrest/postgrest:v11.2.2
    container_name: icm-supabase-rest-prod
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks:
      - icm-network
    restart: always

  supabase-realtime:
    image: supabase/realtime:v2.25.35
    container_name: icm-supabase-realtime-prod
    environment:
      DB_HOST: supabase-db
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq}
    networks:
      - icm-network
    restart: always

  supabase-storage:
    image: supabase/storage-api:v0.43.11
    container_name: icm-supabase-storage-prod
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
    volumes:
      - supabase-storage-data:/var/lib/storage
    networks:
      - icm-network
    restart: always

  supabase-meta:
    image: supabase/postgres-meta:v0.68.0
    container_name: icm-supabase-meta-prod
    environment:
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - icm-network
    restart: always

  supabase-imgproxy:
    image: darthsim/imgproxy:v3.8.0
    container_name: icm-supabase-imgproxy-prod
    volumes:
      - supabase-storage-data:/var/lib/storage
    networks:
      - icm-network
    restart: always

networks:
  icm-network:
    driver: bridge

volumes:
  supabase-db-data:
    driver: local
  supabase-storage-data:
    driver: local

